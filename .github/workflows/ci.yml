name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    steps:
      - uses: actions/checkout@v5
        with:
          # hatch-vcs derives the version from tags.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/pyproject.toml'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,typecheck,lint]"

      - name: Lint (ruff format check + lint)
        run: |
          ruff format --check .
          ruff check .

      - name: Type check (mypy --strict)
        run: mypy src

      - name: Test (coverage floor in pyproject.toml)
        run: pytest -q --cov --cov-report=term-missing

      # The docs toolchain needs a current Python; one build is enough.
      - name: Docs build
        if: matrix.python-version == '3.12'
        run: |
          pip install -e ".[docs]"
          mkdocs build --strict
          python scripts/check_site_refs.py site
