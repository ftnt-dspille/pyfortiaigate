site_name: pyfortiaigate
site_description: Python client for the FortiAIGate 8.x management and gateway API
site_url: https://ftnt-dspille.github.io/pyfortiaigate/
repo_url: https://github.com/ftnt-dspille/pyfortiaigate
repo_name: ftnt-dspille/pyfortiaigate
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            show_if_no_docstring: true
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Actions: actions.md
  - Guide:
      - Authentication & TLS: guide/auth.md
      - Names & re-runnable setup: guide/setup.md
      - Reliability: guide/reliability.md
      - Approval workflow: guide/approval.md
      - Virtual keys & the gateway: guide/gateway.md
      - Usage, cost & logs: guide/reporting.md
      - Errors & rate limits: guide/errors.md
      - Command line: guide/cli.md
  - Reference:
      - FortiAIGate client: reference/client.md
      - Helpers & body builders: reference/helpers.md
      - Record types: reference/types.md
  - Changelog: changelog.md
